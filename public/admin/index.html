<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>管理后台</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
</head>
<body>
  <div id="loading" style="text-align:center;padding:40px;font-family:sans-serif;color:#94a3b8;">
    正在加载后台... 如果长时间无响应，请检查网络。
  </div>
  <script>
    // 内嵌 CMS 配置，避免子路径 config.yml 加载问题
    window.CMS_MANUAL_INIT = true;
  </script>
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@^3.6.4/dist/decap-cms.js"></script>
  <script>
    // 初始化 CMS，内嵌配置
    if (window.decapCMS) {
      window.decapCMS.init({
        config: {
          backend: {
            name: 'github',
            repo: 'pinkyo3o/personal-website',
            branch: 'main',
            auth_type: 'oauth',
            app_id: 'Ov23liyoKU4JPzBtqB8q',
            base_url: 'https://decap-oauth.850339551.workers.dev',
            auth_endpoint: '/auth'
          },
          media_folder: 'public/images',
          public_folder: '/personal-website/images',
          publish_mode: 'simple',
          locale: 'zh_Hans',
          collections: [
            {
              name: 'blog_zh',
              label: '📝 中文博客',
              folder: 'src/content/blog/zh',
              create: true,
              delete: true,
              slug: '{{slug}}',
              extension: 'md',
              fields: [
                { label: '标题', name: 'title', widget: 'string' },
                { label: '摘要', name: 'description', widget: 'string' },
                { label: '发布日期', name: 'pubDate', widget: 'datetime' },
                { label: '更新日期', name: 'updatedDate', widget: 'datetime', required: false },
                { label: '标签', name: 'tags', widget: 'list', required: false },
                { label: '语言', name: 'lang', widget: 'select', options: ['zh'], default: 'zh' },
                { label: '草稿', name: 'draft', widget: 'boolean', default: false },
                { label: '正文', name: 'body', widget: 'markdown' }
              ]
            },
            {
              name: 'blog_en',
              label: '📝 English Blog',
              folder: 'src/content/blog/en',
              create: true,
              delete: true,
              slug: '{{slug}}',
              extension: 'md',
              fields: [
                { label: 'Title', name: 'title', widget: 'string' },
                { label: 'Description', name: 'description', widget: 'string' },
                { label: 'Publish Date', name: 'pubDate', widget: 'datetime' },
                { label: 'Updated Date', name: 'updatedDate', widget: 'datetime', required: false },
                { label: 'Tags', name: 'tags', widget: 'list', required: false },
                { label: 'Language', name: 'lang', widget: 'select', options: ['en'], default: 'en' },
                { label: 'Draft', name: 'draft', widget: 'boolean', default: false },
                { label: 'Body', name: 'body', widget: 'markdown' }
              ]
            }
          ]
        }
      });
    }
    document.getElementById('loading').style.display = 'none';
  </script>
</body>
</html>
