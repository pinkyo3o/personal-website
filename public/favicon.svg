<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9a8c9"/>
      <stop offset="100%" style="stop-color:#8ecae6"/>
    </linearGradient>
  </defs>
  <!-- 圆角背景 -->
  <rect width="100" height="100" rx="25" fill="url(#bg)"/>
  <!-- 白色猫咪脸 -->
  <ellipse cx="50" cy="55" rx="28" ry="25" fill="white"/>
  <!-- 猫耳朵 -->
  <polygon points="28,38 35,18 45,35" fill="white"/>
  <polygon points="72,38 65,18 55,35" fill="white"/>
  <polygon points="31,35 36,25 42,33" fill="#fcd5e5"/>
  <polygon points="69,35 64,25 58,33" fill="#fcd5e5"/>
  <!-- 猫眼睛 -->
  <ellipse cx="40" cy="52" rx="3.5" ry="5" fill="#4a5568"/>
  <ellipse cx="60" cy="52" rx="3.5" ry="5" fill="#4a5568"/>
  <!-- 眼睛高光 -->
  <circle cx="41" cy="50" r="1.2" fill="white"/>
  <circle cx="61" cy="50" r="1.2" fill="white"/>
  <!-- 粉色鼻子 -->
  <path d="M 48 60 L 52 60 L 50 64 Z" fill="#f9a8c9"/>
  <!-- 嘴 -->
  <path d="M 50 64 Q 47 67 44 65" stroke="#94a3b8" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M 50 64 Q 53 67 56 65" stroke="#94a3b8" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- 腮红 -->
  <circle cx="35" cy="60" r="3" fill="#fcd5e5" opacity="0.7"/>
  <circle cx="65" cy="60" r="3" fill="#fcd5e5" opacity="0.7"/>
</svg>
